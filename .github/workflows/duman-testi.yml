name: Duman testi (emülatör)

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'core/**'
      - 'scripts/**'
      - '.github/workflows/duman-testi.yml'
  workflow_dispatch:

concurrency:
  group: egea-duman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kodu al
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle önbelleği
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: KVM izni
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde çalıştır (Android 11, 1280x720)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x720
          script: bash scripts/duman-testi.sh

      - name: Ekran görüntüleri ve dökümler
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duman-testi
          path: duman-ciktisi/
          if-no-files-found: ignore
