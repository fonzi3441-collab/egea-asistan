name: probe
on:
  push:
    branches: ['**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sürümler ve veri kaynakları
        run: |
          set +e
          M=https://dl.google.com/dl/android/maven2
          vers() { curl -s "$M/$1/maven-metadata.xml" | grep -oE '<version>[^<]+</version>' | sed -E 's#</?version>##g' | grep -vE 'alpha|beta|rc|dev' | tail -${2:-5} | tr '\n' ' '; echo; }
          for a in androidx/media3/media3-exoplayer androidx/media3/media3-session androidx/media3/media3-ui androidx/media3/media3-exoplayer-hls androidx/recyclerview/recyclerview; do
            echo "== $a: $(vers $a)"
          done
          MV=$(curl -s "$M/androidx/media3/media3-exoplayer/maven-metadata.xml" | grep -oE '<version>[^<]+</version>' | sed -E 's#</?version>##g' | grep -vE 'alpha|beta|rc|dev' | tail -1)
          RV=$(curl -s "$M/androidx/recyclerview/recyclerview/maven-metadata.xml" | grep -oE '<version>[^<]+</version>' | sed -E 's#</?version>##g' | grep -vE 'alpha|beta|rc|dev' | tail -1)
          for p in "androidx/media3/media3-exoplayer/$MV/media3-exoplayer-$MV.aar" "androidx/media3/media3-session/$MV/media3-session-$MV.aar" "androidx/recyclerview/recyclerview/$RV/recyclerview-$RV.aar"; do
            echo "== $p"; curl -s -o /tmp/x.aar "$M/$p" && unzip -p /tmp/x.aar META-INF/com/android/build/gradle/aar-metadata.properties | grep -E "minCompileSdk|minAndroidGradle"
          done
          curl -s "$M/androidx/media3/media3-exoplayer/$MV/media3-exoplayer-$MV.pom" | grep -A2 "<artifactId>" | grep -E "artifactId|version" | head -30
          echo "== radio-browser sunucular"
          curl -s --max-time 20 https://all.api.radio-browser.info/json/servers | head -c 600; echo
          echo "== radio-browser TR ilk 8"
          curl -s --max-time 20 -A "EgeaAsistan/1.0" "https://de1.api.radio-browser.info/json/stations/search?countrycode=TR&hidebroken=true&order=clickcount&reverse=true&limit=8" | python3 -c "import sys,json; [print(s['name'],'|',s['url_resolved'],'|',s['codec'],s['bitrate'],'|',s['favicon'][:60],'|',s['tags'][:40]) for s in json.load(sys.stdin)]"
          echo "== radio-browser TR toplam"
          curl -s --max-time 30 -A "EgeaAsistan/1.0" "https://de1.api.radio-browser.info/json/stations/search?countrycode=TR&hidebroken=true&limit=1000" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))"
          echo "== iptv-org TR m3u"
          curl -sL --max-time 30 https://iptv-org.github.io/iptv/countries/tr.m3u -o /tmp/tr.m3u; wc -l /tmp/tr.m3u; grep -c EXTINF /tmp/tr.m3u
          head -30 /tmp/tr.m3u
          grep -E "EXTVLCOPT|KODIPROP" /tmp/tr.m3u | sort | uniq -c | sort -rn | head -10
          grep -iE "trt|show tv|kanal d|atv|star tv|fox|now|tv8|haber" /tmp/tr.m3u | grep EXTINF | sed -E 's/.*,//' | head -40
          echo "== bir TRT akışı"
          U=$(grep -A1 -i 'TRT 1' /tmp/tr.m3u | grep -v EXTINF | grep http | head -1); echo "$U"; curl -s --max-time 15 -o /dev/null -w "%{http_code} %{content_type}\n" "$U"
