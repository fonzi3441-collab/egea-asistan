name: probe
on:
  workflow_dispatch:
  push:
    branches: ['**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Aksiyon sürümleri
        run: |
          set +e
          for r in actions/checkout actions/setup-java actions/upload-artifact actions/cache gradle/actions; do
            echo "$r: $(git ls-remote --tags --refs https://github.com/$r | grep -oE 'refs/tags/v[0-9]+$' | sed 's#refs/tags/##' | sort -V | tail -3 | tr '\n' ' ')"
          done
