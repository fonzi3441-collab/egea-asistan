name: APK derle

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Tüm dallar tek sırada çalışır; "latest" release'i aynı anda iki iş silip oluşturmasın.
concurrency:
  group: egea-asistan-apk
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit testler (komut çözümleyici)
        run: ./gradlew --stacktrace :core:test

      - name: Release APK derle
        run: ./gradlew --stacktrace assembleRelease

      - name: APK'yı egea-asistan.apk olarak adlandır
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Bulunan APK: $APK"
          cp "$APK" egea-asistan.apk
          ls -la egea-asistan.apk

      - name: Test raporlarını yükle (hata varsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: core/build/reports/tests/
          if-no-files-found: ignore

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: egea-asistan
          path: egea-asistan.apk
          if-no-files-found: error

      - name: '"latest" release''ini yenile'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          cat > notlar.md <<NOTLAR
          versionCode: ${{ github.run_number }}
          versionName: 1.0.${{ github.run_number }}
          Dal: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Sabit indirme linki: https://github.com/${{ github.repository }}/releases/latest/download/egea-asistan.apk
          NOTLAR
          gh release create latest egea-asistan.apk \
            --title "Egea Asistan 1.0.${{ github.run_number }}" \
            --notes-file notlar.md \
            --target "${{ github.sha }}" \
            --latest
